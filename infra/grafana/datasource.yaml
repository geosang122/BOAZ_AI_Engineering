# Grafana가 ClickHouse를 읽는 연결. dashboard/의 패널과 알림은 uid "clickhouse"로 이걸 쓴다.
apiVersion: 1
datasources:
  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    isDefault: true
    jsonData:
      host: ${CLICKHOUSE_HOST}
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: default
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
